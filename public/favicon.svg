<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for high contrast on both dark and light browser tabs -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7EFE4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C191" />
      <stop offset="100%" stop-color="#C8A878" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#211A19" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Crisp Bright Circular Badge with Gold & Oxblood Border -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#541D26" stroke-width="4" filter="url(#badgeShadow)" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#C8A878" stroke-width="1.5" />

  <!-- DigiLocal Brand Emblem (Maximized & Bold for Instant 16px/32px Legibility) -->
  <g id="digilocal-emblem" transform="translate(0, 0)">
    <!-- Basket Handle Arc -->
    <path d="M 39 48 A 25 25 0 0 1 89 48" fill="none" stroke="#541D26" stroke-width="6" stroke-linecap="round" />
    
    <!-- Top Gold Dot Pin -->
    <circle cx="64" cy="24" r="5.5" fill="url(#goldGrad)" stroke="#541D26" stroke-width="1.5" />

    <!-- Two Sprouts / Leaves -->
    <path d="M 64 45 C 57 40 55 33 63 32 C 65 37 65 42 64 45 Z" fill="#541D26" />
    <path d="M 64 45 C 71 40 73 33 65 32 C 63 37 63 42 64 45 Z" fill="#541D26" />

    <!-- Horizontal Basket Rim -->
    <rect x="22" y="49" width="84" height="9" rx="4.5" fill="#541D26" />

    <!-- Basket Body & Weave Base -->
    <path d="M 28 58 L 36 94 C 38 98 43 101 49 101 L 79 101 C 85 101 90 98 92 94 L 100 58 Z" fill="#541D26" />
    
    <!-- Gold Weave Accent Strips -->
    <path d="M 40 60 L 46 99" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 88 60 L 82 99" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <rect x="58" y="94" width="12" height="7" rx="2" fill="url(#goldGrad)" />

    <!-- Inner Cream Badge for Letter "D" -->
    <rect x="44" y="60" width="40" height="34" rx="6" fill="#FAF5ED" />

    <!-- Bold Stylized Letter "D" (Signature DigiLocal Monogram) -->
    <path d="M 52 65 L 62 65 C 72 65 77 70 77 77 C 77 84 72 89 62 89 L 52 89 Z M 58 71 L 58 83 L 62 83 C 67 83 70 80 70 77 C 70 74 67 71 62 71 Z" fill="#541D26" />
  </g>
</svg>
