<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <style>
      .brand-blue { fill: #0096db; stroke: #0096db; }
      .brand-yellow { fill: #f2c010; }
      .tagline-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 4px; fill: #111827; }
    </style>
  </defs>
  
  <!-- Cloud Contour -->
  <path d="M 280 280 
           C 240 280, 200 240, 180 200 
           C 140 200, 100 240, 100 290 
           C 100 340, 130 380, 180 390
           L 620 390
           C 670 390, 710 350, 710 300
           C 710 240, 660 200, 610 200
           C 590 120, 500 50, 410 50
           C 330 50, 290 120, 280 200 Z" 
        fill="none" stroke="#0096db" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code Bracket Left < -->
  <path d="M 325 215 L 260 250 L 325 285" fill="none" stroke="#0096db" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Code Bracket Right > -->
  <path d="M 475 215 L 540 250 L 475 285" fill="none" stroke="#0096db" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold Lightning Bolt slicing vertically -->
  <polygon points="485,110 390,290 445,290 350,470 480,245 425,245" fill="#f2c010"/>

  <!-- ZORDIAL Text Graphic -->
  <g transform="translate(10, 460)">
    <!-- Z -->
    <path d="M 10 20 H 160 L 35 110 H 160 M 10 20 L 140 20 C 170 20, 170 110, 100 110" fill="none" stroke="#0096db" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- O -->
    <ellipse cx="225" cy="65" rx="50" ry="45" fill="none" stroke="#0096db" stroke-width="18"/>
    
    <!-- R -->
    <path d="M 300 20 V 110 M 300 20 H 350 C 380 20, 380 65, 350 65 H 300 M 335 65 L 380 110" fill="none" stroke="#0096db" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- D -->
    <path d="M 410 20 V 110 M 410 20 H 450 C 500 20, 500 110, 450 110 H 410" fill="none" stroke="#0096db" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- i -->
    <path d="M 535 20 V 110" fill="none" stroke="#0096db" stroke-width="18" stroke-linecap="round"/>
    
    <!-- A -->
    <path d="M 570 110 L 615 20 L 660 110 M 585 80 H 645" fill="none" stroke="#0096db" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- L -->
    <path d="M 695 20 V 110 H 755" fill="none" stroke="#0096db" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="620" text-anchor="middle" class="tagline-text">TRANSFORMING IDEAS INTO APPLICATIONS..</text>
</svg>
